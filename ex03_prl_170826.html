<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let p1;
      let p2;
      let p3;
      let pf;
      let mp;
      let mf;

      p1 = parseFloat(prompt(" Digite a nota 1"));
      p2 = parseFloat(prompt(" Digite a nota 2"));
      p3 = parseFloat(prompt(" Digite a nota 3"));
      pf = parseFloat(prompt(" Digite a nota da prova final"));
      mp = (p1+p2+p3)/3;
      mf =(mp+(2*pf))/3
      document.write("media Final:" + mf)


    </script>
  </body>
</html>
