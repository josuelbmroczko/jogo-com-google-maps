
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let nota = []
        let verdaeiro = true


        while(verdaeiro){
            let adicionarnora = parseFloat(prompt("adicionar nota"))
            
            if(adicionarnora === 0){
                break
            }else{
                nota.push(adicionarnora)
            }

        }
        let somartudo = 0
        for(let i =0; i < nota.length; i++){
            somartudo += nota[i]
            
        }
        let media = somartudo/ nota.length
        console.log(media);
        
    </script>
</body>
</html>
